[package]
name = "fraud_spike_detector"
version = "0.1.0"
edition = "2021"

[lib]
name = "fraud_spike_detector"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22.0", features = ["extension-module"] }
dashmap = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdkafka = { version = "0.36", features = ["cmake-build"] }
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
